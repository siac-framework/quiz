<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Header and Introduction -->
<div class="quiz-header">
  <h1>The Bridge Quiz! 🏰</h1>
  <p class="intro-text">These questions may seem simple, but crossing successfully depends on answering correctly. Choose wisely...</p>
</div>

<div class="quiz-container" id="quizContainer">
  <!-- Questions rendered dynamically by JavaScript -->
</div>

<div class="results-container" id="resultsContainer">
  <h2>Your Results</h2>
  <table class="results-table">
    <thead>
      <tr>
        <th>Topic</th>
        <th>Score</th>
      </tr>
    </thead>
    <tbody id="resultsBody"></tbody>
  </table>
  <button class="submit-btn" onclick="resetQuiz()" style="margin-top: 1rem; background: #2196f3;">
    Take Quiz Again ↻
  </button>
</div>

<script src="scripts.js"></script>

</body>
</html>
