<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theological & Social Quiz</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="quiz-header">
    <h1>Biblical Alignment Assessment</h1>
    <p class="intro-text">Answer the questions below to get a profile of your theological and social alignment.</p>
  </div>

  <!-- Quiz Container -->
  <div id="quizContainer" class="quiz-container">
    <!-- Questions will be dynamically inserted here by JavaScript -->
  </div>

  <!-- Results Container (Initially Hidden) -->
  <div id="resultsContainer" class="results-container hide" style="display: none;">
    <h2>Your Results</h2>
    <table class="results-table">
      <thead>
        <tr>
          <th>Topic</th>
          <th>Score</th>
          <th>Label</th>
        </tr>
      </thead>
      <tbody id="resultsBody">
      </tbody>
    </table>
    <button class="reset-btn" onclick="resetQuiz()" style="margin-top: 1rem; background: #2196f3;">
      Take Quiz Again ↻
    </button>
  </div>

  <script src="scripts.js"></script>
</body>
</html>
